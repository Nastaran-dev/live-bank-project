<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Bank</title>
<link rel="stylesheet" href="css/output.css">
<style>
 .card {
  background: linear-gradient(to right, #4d92c3, #19547b);
  color: white;
  transition: transform 1s ease-in-out, box-shadow 1s ease-in-out;
  background-repeat: no-repeat;
  position: relative;
  transform-style: preserve-3d;
}

.card > div {
  backface-visibility: hidden;
}

.card .back {
  background: linear-gradient(to right, #4d92c3, #19547b);
  transform: rotateY(180deg);
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  border-radius: inherit;
}

.card:hover {
  transform: rotateY(180deg);
  box-shadow: 0 15px 25px rgba(0,0,0,0.3);
}

  input:focus {
    outline: none;
    border-color:#19547b;
    box-shadow: 0 0 0 3px rgba(79,70,229,0.3);
  }
  .bg{
    background: linear-gradient(to right, #4b6cb7, #182848);
    perspective: 1000px;
  }
</style>
</head>
<body class="">
<div class="flex flex-col items-center min-h-screen pt-10 bg">
  <div class="relative flex flex-col p-5 pl-1 mb-10 duration-700 shadow-lg card w-80 sm:w-96 rounded-2xl group ">
 <div class="absolute top-0 left-0 flex-col w-full h-full duration-1000 group-hover:flex rounded-2xl back">
  <div class="top-0 left-0 w-full h-[60px] bg-black absolute rounded-t-2xl text-black"></div>
  <span class=" text-[10px] mt-[15%] flex p-9 text-center text-white span transform-none ">Please refrain from revealing your card password and choosing predictable limits for your card.</span>
  <p class="w-[85%] h-0.5 bg-black mx-auto"></p>
  <div class="flex gap-2 ">
    <p class="text-white text-[7px] text-left mt-3 ml-7">The finder of the card is asked to return it to one of Saman Bank branches.</p>
    <img src="img/بانک-سامان.png" alt="" class="w-[25px] object-cover mt-0.5 mr-10 ">
  </div>
 </div>
  <div class="flex-1 pl-4">
    <div id="CardName" class="text-lg font-extrabold">FULL NAME</div>
    <div class="flex justify-between mt-4 font-mono text-xl tracking-widest">
      <div id="CardNum1">####</div>
      <div id="CardNum2">####</div>
      <div id="CardNum3">####</div>
      <div id="CardNum4">####</div>
    </div>
    <div class="flex justify-between mt-4 text-sm uppercase">
      <div>
        <div>Exp</div>
        <div class="flex gap-1">
          <div id="CardYear">####</div>/<div id="CardMonth">##</div>
        </div>
      </div>
      <div>
        <div>CVV2</div>
        <div id="CardCvv2">###</div>
      </div>
    </div>
    <div class="flex items-center justify-between mt-4 text-sm">
      <span>Saman Bank</span>
      <img src="img/بانک-سامان.png" alt="" class="w-6">
    </div>
  </div>
</div>


<div class="w-11/12 p-6 mb-12 bg-white shadow-xl m sm:w-3/4 md:w-1/2 lg:w-1/3 rounded-2xl">
  <label class="text-sm font-semibold">Card Holder</label>
  <input type="text" placeholder="Full Name" data-target="CardName" class="w-full p-3 mt-1 transition duration-300 border rounded-xl">

  <label class="block mt-4 text-sm font-semibold">Card Number</label>
  <div class="flex gap-2 mt-2">
    <input type="text" maxlength="4" id="c1" data-next="c2" data-target="CardNum1" class="w-1/4 p-3 font-mono text-center border rounded-xl">
    <input type="text" maxlength="4" id="c2" data-next="c3" data-prev="c1" data-target="CardNum2" class="w-1/4 p-3 font-mono text-center border rounded-xl">
    <input type="text" maxlength="4" id="c3" data-next="c4" data-prev="c2" data-target="CardNum3" class="w-1/4 p-3 font-mono text-center border rounded-xl">
    <input type="text" maxlength="4" id="c4" data-next="Year" data-prev="c3" data-target="CardNum4" class="w-1/4 p-3 font-mono text-center border rounded-xl">
  </div>

  <label class="block mt-4 text-sm font-semibold">Expiration</label>
  <div class="flex gap-3 mt-2">
    <input type="text" placeholder="Year" maxlength="4" id="Year" data-next="Month" data-prev="c4" data-target="CardYear" class="w-1/2 p-3 font-mono text-center border rounded-xl">
    <input type="text" placeholder="Month" maxlength="2" id="Month" data-next="cvv2" data-prev="Year" data-target="CardMonth" class="w-1/2 p-3 font-mono text-center border rounded-xl">
  </div>

  <label class="block mt-4 text-sm font-semibold">CVV2</label>
  <input type="text" placeholder="CVV2" maxlength="4" id="cvv2" data-prev="Month" data-target="CardCvv2" class="w-full p-3 mt-2 font-mono text-center border rounded-xl">

  <button class="w-full p-3 mt-6 text-xl font-semibold text-white transition duration-700 shadow-lg bg-gradient-to-r from-cyan-900 to-cyan-600 hover:from-cyan-600 hover:to-cyan-900 rounded-xl dyra">Submit</button>
</div>
</div>

  </div>
</footer>
<script src="script.js"></script>
</body>
</html>
